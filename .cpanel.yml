---
deployment:
  tasks:
    # Set deployment paths
    - export DEPLOYPATH=/home/fctcnsed/public_html/
    - export APPPATH=/home/fctcnsed/fctcns-app/

    # Copy public folder contents to public_html (web root)
    - /bin/cp -R public/* $DEPLOYPATH

    # Create application directory
    - /bin/mkdir -p $APPPATH

    # Copy app directory (controllers, models, views, etc.)
    - /bin/cp -R app $APPPATH/

    # Copy database directory
    - /bin/cp -R database $APPPATH/

    # Copy config directory
    - /bin/cp -R app/config $APPPATH/app/

    # Create logs directory
    - /bin/mkdir -p $APPPATH/app/logs
    - /bin/chmod 755 $APPPATH/app/logs

    # Clean up git files from public deployment
    - /bin/rm -rf $DEPLOYPATH/.git 2>/dev/null ||:
    - /bin/rm -rf $DEPLOYPATH/.gitignore 2>/dev/null ||:

    # Set proper permissions
    - /bin/chmod -R 755 $DEPLOYPATH
    - /bin/chmod -R 755 $APPPATH

    # Create uploads directory with write permissions
    - /bin/mkdir -p $DEPLOYPATH/assets/uploads
    - /bin/chmod 777 $DEPLOYPATH/assets/uploads
